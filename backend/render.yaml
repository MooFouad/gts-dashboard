services:
  - type: web
    name: gts-dashboard-api
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
        # IMPORTANT: Set this in Render Dashboard to your Vercel frontend URL
        # Example: https://your-app.vercel.app
        # For multiple origins use comma-separated: https://app1.vercel.app,https://app2.com
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
      - key: EMAIL_SERVICE
        value: ""
        # Leave empty for Brevo SMTP (recommended for Render)
        # Gmail SMTP port 587 is BLOCKED on Render free tier
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
        # For Brevo SMTP relay
      - key: EMAIL_PORT
        value: 587
        # Brevo SMTP port
      - key: APP_URL
        sync: false
        # Set this to your Vercel frontend URL (e.g., https://your-app.vercel.app)
      - key: NOTIFICATION_DAYS_BEFORE
        value: 10
      - key: NOTIFICATION_CHECK_HOUR
        value: 9
      - key: TAMM_API_URL
        value: https://api.elm.sa
      - key: TAMM_AUTH_URL
        value: https://idp.elm.sa/auth/realms/Tamm/protocol/openid-connect/token
      - key: TAMM_REALM_NAME
        value: Tamm
      - key: TAMM_CLIENT_ID
        sync: false
      - key: TAMM_CLIENT_SECRET
        sync: false
      - key: TAMM_CUSTOMER_ID
        sync: false
      - key: TAMM_SUBSCRIPTION_KEY
        value: ""
